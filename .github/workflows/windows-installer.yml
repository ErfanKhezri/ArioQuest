# Builds the Windows installers (.exe and .msi).
# - Every push to master and every manual run: download them from the run's "Artifacts".
# - Pushing a tag like v0.2.0: they are also attached to a GitHub Release.
name: Windows installer

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # needed to create the release for tags

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # Runs typecheck + vite build, then compiles Rust and bundles NSIS (.exe) and MSI.
      - run: pnpm app:build

      - uses: actions/upload-artifact@v4
        with:
          name: ArioQuest-windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
