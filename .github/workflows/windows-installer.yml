# Test build of the Windows installers (.exe and .msi) for every push to master.
# Download them from the run's "Artifacts". Published releases come from release.yml.
name: Windows installer

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # Runs typecheck + vite build, then compiles Rust and bundles NSIS (.exe) and MSI.
      - run: pnpm app:build

      - uses: actions/upload-artifact@v4
        with:
          name: ArioQuest-windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
