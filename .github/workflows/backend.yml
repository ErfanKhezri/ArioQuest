# Tests the backend and builds the Linux binary the server runs.
# Runs when anything under backend/ changes. The binary is attached to the run
# as the "ario-api" artifact (Actions tab -> the run -> Artifacts).
name: Backend

on:
  push:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - run: go vet ./...

      - run: go test ./...

      # CGO_ENABLED=0 makes one self-contained file with no system libraries needed.
      - name: Build
        run: go build -o bin/ario-api ./cmd/server
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "0"

      - uses: actions/upload-artifact@v4
        with:
          name: ario-api
          path: backend/bin/ario-api
          retention-days: 14
