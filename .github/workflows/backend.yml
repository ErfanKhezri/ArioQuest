# Tests the backend, builds the Linux binary, and publishes it for the server.
# Runs when anything under backend/ changes. The binary is attached to the run
# as the "ario-api" artifact (Actions tab -> the run -> Artifacts).
#
# Pushes to master also publish the build to the "backend-latest" pre-release.
# The server cannot be reached from outside Iran, so GitHub cannot push to it;
# instead the server checks that release every minute and installs new builds
# (see backend/deploy/update.sh).
name: Backend

on:
  push:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - run: go vet ./...

      - run: go test ./...

      # CGO_ENABLED=0 makes one self-contained file with no system libraries needed.
      - name: Build
        run: go build -o bin/ario-api ./cmd/server
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "0"

      - uses: actions/upload-artifact@v4
        with:
          name: ario-api
          path: backend/bin/ario-api
          retention-days: 14

  publish:
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create and update the release
    # Never publish two builds at the same time; a newer push waits for the older one.
    concurrency:
      group: backend-publish
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ario-api

      # The server checks version.txt to see whether there is a new build, and
      # ario-api.sha256 to make sure the download is complete.
      - name: Prepare files
        run: |
          sha256sum ario-api > ario-api.sha256
          echo "$GITHUB_SHA" > version.txt

      # A pre-release, so the "latest release" link still points to the Windows app.
      - name: Create the release if it does not exist
        run: |
          gh release view backend-latest > /dev/null 2>&1 ||
            gh release create backend-latest --prerelease --target "$GITHUB_SHA" \
              --title "Backend (latest build)" \
              --notes "Latest build of the backend from master. The server installs it automatically."

      # version.txt goes last: the server only sees a new version once its files are there.
      - name: Upload the build
        run: |
          gh release upload backend-latest ario-api ario-api.sha256 --clobber
          gh release upload backend-latest version.txt --clobber
