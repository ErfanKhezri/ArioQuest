# Publishes a GitHub Release with the Windows installers attached.
#
# Start it either way:
# - Actions tab -> "Release" -> "Run workflow", and type a version such as 0.2.0.
# - Or push a tag: git tag v0.2.0 && git push origin v0.2.0
#
# The version is written into the app for this build only (installer name, About info),
# so nothing has to be committed first.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.2.0 (no leading v)"
        required: true
      prerelease:
        description: "Mark as a pre-release"
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: write # create the tag and the release

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"
          fi
          # The MSI installer only accepts plain numeric versions.
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 1.2.3, got '$VERSION'"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Stamp the version into the app
        run: |
          node -e '
            const fs = require("fs");
            for (const file of ["package.json", "src-tauri/tauri.conf.json"]) {
              const json = JSON.parse(fs.readFileSync(file, "utf8"));
              json.version = process.env.VERSION;
              fs.writeFileSync(file, JSON.stringify(json, null, 2) + "\n");
            }
          '

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # Typecheck + vite build, then the Rust build and the NSIS (.exe) and MSI bundles.
      - run: pnpm app:build

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: ArioQuest ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
          body: |
            ## Install on Windows
            Download **ArioQuest_${{ env.VERSION }}_x64-setup.exe** below and run it
            (or use the `.msi`). Windows SmartScreen may warn because the installer is
            not code-signed yet: choose "More info" -> "Run anyway".
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
